# The API has no authentication, so listen on loopback only. Pass --server.address to listen elsewhere.
server.address=127.0.0.1
# Observability (see README "Observability"): health, info and Prometheus metrics only.
management.endpoints.web.exposure.include=health,info,prometheus
# Each run's correlation id (its run id) is in the MDC while the run executes; show it on every log line.
logging.pattern.correlation=[%X{runId:-}] 
