name: ci
on: [push, pull_request]
# No concurrency group: CI runs, on main above all, are never cancelled.
# npm run ci:local runs the same run: steps in the same order; scripts/ci-local.test.mjs
# fails when the two drift apart.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install fhir-crd-router at the pinned commit
        run: bash scripts/install-crd-router.sh
      - run: ./mvnw -B verify
      - name: Demo tour (reuses the jar built by verify)
        run: DEMO_SKIP_BUILD=1 node scripts/demo.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked UI test dependencies
        run: npm ci --ignore-scripts
      - name: Install UI browsers
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - name: Verify disposable-instance safety boundaries
        run: npm run test:ui-instance
      - name: Disposable synthetic UI journeys (one worker)
        run: npm run test:ui
      - name: Stop the owned UI instance even on failure
        if: always()
        run: node scripts/ui-instance.mjs stop
      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results
          path: |
            playwright-report/
            test-results/
            .ui-test/app.log
          if-no-files-found: ignore
      - name: Export the website replay bundle (reuses the jar)
        run: EXPORT_SKIP_BUILD=1 node scripts/export-replays.mjs
      - name: Check the leak scanner against the shared redaction corpus
        run: node --test replay/test/leaks.test.mjs
      - name: Check the replay bundle
        run: node --test replay/test/bundle.test.mjs
      - name: Check the audit reader regression suite
        run: node --test scripts/audit-reader.test.mjs
      - name: Check the workbench lifecycle regression suite (timeout fails a hung cleanup)
        run: node --experimental-vm-modules --test --test-timeout=10000 scripts/workbench-lifecycle.test.mjs
      - name: Check the verify skill's doctor and cleanup
        run: npm run test:verify
      - name: Check that npm run ci:local matches this workflow
        run: node --test scripts/ci-local.test.mjs
      - name: Upload demo reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: demo-output
          path: demo-output/
          if-no-files-found: ignore
      - name: Upload replay bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: site-dist/
          if-no-files-found: ignore

  # The outside judge: the workbench against the HL7 Da Vinci CRD reference server, a
  # CDS Hooks / CRD implementation this project didn't write, at the commits pinned in
  # scripts/crd-reference-server.env. It runs beside build (no needs) and builds its own
  # jar from this commit. The server image is cached by the pin, so only a bump rebuilds it.
  crd-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore the reference server image for the pinned commits
        id: image
        uses: actions/cache/restore@v6
        with:
          path: .crd-ri/image.tar
          key: crd-reference-server-${{ hashFiles('scripts/crd-reference-server.env', 'scripts/crd-reference-server.Dockerfile') }}
      - name: Start the CRD reference server on loopback (builds the image on a cache miss)
        env:
          CRD_RI_IMAGE_TAR: .crd-ri/image.tar
        run: bash scripts/crd-reference-server.sh start
      - name: Cache the reference server image
        if: always() && steps.image.outputs.cache-hit != 'true' && hashFiles('.crd-ri/image.tar') != ''
        uses: actions/cache/save@v6
        with:
          path: .crd-ri/image.tar
          key: ${{ steps.image.outputs.cache-primary-key }}
      - name: Install fhir-crd-router at the pinned commit
        run: bash scripts/install-crd-router.sh
      - name: Build the workbench jar (tests run in build)
        run: ./mvnw -B -pl workbench-app -am package -DskipTests
      - name: Reference runs against the CRD reference server
        run: REFERENCE_SKIP_BUILD=1 node --test scripts/reference-runs.mjs
      - name: Stop the CRD reference server even on failure
        if: always()
        run: bash scripts/crd-reference-server.sh stop
      - name: Upload reference run reports and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crd-reference-runs
          path: |
            .crd-ri/reports/
            .crd-ri/*.log
          if-no-files-found: ignore

  # The outside judge for response content: the official HL7 FHIR Validator, pinned with the
  # Da Vinci CRD 2.2.1 package in scripts/hl7-validator.env, judges every response in the
  # conformance corpus, and response.schema, response.coverage-information and
  # response.coverage-location must agree with it (diagnostics HL7ValidatorConformanceTest).
  # It runs beside build (no needs). The jar and FHIR packages are cached by the pins file, so
  # only a bump downloads them; the test itself runs with the validator's network access off.
  hl7-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Restore the pinned HL7 validator and FHIR packages
        id: validator-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/hl7-validator
          key: hl7-validator-${{ hashFiles('scripts/hl7-validator.env') }}
      - name: Download the pinned HL7 validator and FHIR packages (no-op when cached)
        id: warm
        run: bash scripts/hl7-validator.sh warm
      - name: Cache the HL7 validator and FHIR packages
        if: always() && steps.warm.outcome == 'success' && steps.validator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/hl7-validator
          key: ${{ steps.validator-cache.outputs.cache-primary-key }}
      - name: Install fhir-crd-router at the pinned commit
        run: bash scripts/install-crd-router.sh
      - name: Differential conformance test against the HL7 validator (offline)
        run: bash scripts/hl7-validator.sh test
      - name: Upload the conformance report and validator output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hl7-validator-conformance
          path: diagnostics/target/hl7-validator/
          if-no-files-found: ignore

  # The one required check for the ruleset and `ao ready`. It always reports and
  # fails unless every needed job succeeded. Add every job added to this file to
  # needs; scripts/ci-local.test.mjs fails when one is missing.
  gate:
    needs: [build, crd-reference, hl7-validator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
