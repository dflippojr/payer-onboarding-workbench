name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install fhir-crd-router at the pinned commit
        run: bash scripts/install-crd-router.sh
      - run: ./mvnw -B verify
